name: Build and Deploy
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Deploy to docs
        run: |
          rm -f .gitignore
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/
          git commit -m "auto-build: deploy latest changes" || true
          git push
